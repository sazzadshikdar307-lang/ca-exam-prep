<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA Exam Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Ledger paper, ink, and brass-seal palette — grounded in accounting stationery,
       not the usual cream+terracotta or dark+neon defaults. */
    --paper:#EEF2E9; --paper-alt:#E4EADD; --line:#C4D0BC;
    --ink:#1B2B29; --ink-soft:#33463F; --muted:#5E6C60;
    --brass:#8A6A2F; --brass-soft:#D9C99A;
    --seal:#7A3430; --seal-bg:#F1E1DD;
    --approve:#2E6B4C; --approve-bg:#DEEAE0;
    --surface:#FBFAF5;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  h1,h2,.serif{font-family:'Source Serif 4',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .app{max-width:900px;margin:0 auto;padding:0 0 70px;}

  /* ---- Masthead ---- */
  .cover{background:var(--ink);color:var(--paper);padding:26px 26px 20px;position:relative;
    border-bottom:6px double var(--brass-soft);
    display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;}
  .cover h1{margin:0;font-size:25px;font-weight:600;letter-spacing:.2px;}
  .cover .tagline{margin:6px 0 0;color:var(--brass-soft);font-size:13px;}
  .cover .refline{font-family:'JetBrains Mono',monospace;font-size:11px;color:#93A69C;margin-top:3px;}
  .userbox{display:flex;align-items:center;gap:10px;}
  .userbox img{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--brass-soft);}
  .userbox span{font-size:13px;color:var(--paper-alt);}

  /* ---- Nav: ledger index tabs ---- */
  nav{display:flex;flex-wrap:wrap;background:var(--paper-alt);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  nav button{flex:1 1 auto;min-width:100px;background:transparent;border:none;border-right:1px solid var(--line);
    padding:12px 8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;
    border-bottom:3px solid transparent;transition:border-color .15s, color .15s;}
  nav button:last-child{border-right:none;}
  nav button.active{color:var(--ink);border-bottom-color:var(--seal);}
  nav button:hover:not(.active){color:var(--ink-soft);}

  main{padding:24px 22px;}

  /* ---- Sections: hairline rule + left mark, not boxed shadow cards ---- */
  .card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--brass);
    border-radius:2px;padding:20px;margin-bottom:18px;}
  .card h2{font-size:16.5px;margin:0 0 14px;font-weight:600;}

  label{display:block;font-size:13px;font-weight:600;margin:14px 0 5px;color:var(--ink-soft);}
  input[type=text],input[type=number],textarea,select{width:100%;padding:9px 10px;border:1px solid var(--line);
    border-radius:2px;font-size:14.5px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--brass-soft);outline-offset:1px;border-color:var(--brass);}
  textarea{resize:vertical;min-height:60px;}
  input[type=file]{width:100%;padding:9px 10px;border:1px dashed var(--brass);border-radius:2px;background:var(--paper-alt);}
  .opt-row{display:flex;align-items:center;gap:9px;margin-top:7px;padding-bottom:7px;border-bottom:1px solid var(--paper-alt);}
  .opt-row input[type=text]{flex:1;}
  .opt-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--approve);flex-shrink:0;}

  .btn{display:inline-block;padding:10px 18px;background:var(--ink);color:var(--paper);border:1px solid var(--ink);
    border-radius:2px;font-weight:600;font-size:14px;cursor:pointer;margin-top:14px;transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn.gold{background:var(--brass);color:#fff;border-color:var(--brass);}
  .btn.outline{background:transparent;border:1px solid var(--ink);color:var(--ink);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  .qitem{border-bottom:1px solid var(--paper-alt);padding:13px 0;}
  .qitem:last-child{border-bottom:none;}
  .qtext{font-weight:600;font-size:14.5px;}
  .qopts{font-size:13px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono',monospace;}
  .qmeta{font-size:11.5px;color:var(--brass);margin-top:5px;font-weight:600;}
  .qtrace{font-size:11px;color:var(--muted);margin-top:3px;}
  .tag{display:inline-block;background:var(--paper-alt);color:var(--ink-soft);border:1px solid var(--line);
    font-size:11px;padding:2px 8px;border-radius:2px;margin-right:6px;font-weight:600;}
  .del-btn{background:none;border:none;color:var(--seal);cursor:pointer;font-size:13px;font-weight:600;}
  .empty{text-align:center;padding:30px 10px;color:var(--muted);}

  /* ---- Stat strip: a statement summary line, not colored tiles ---- */
  .stat-grid{display:flex;flex-wrap:wrap;border-top:1px solid var(--line);border-bottom:3px double var(--line);}
  .stat{flex:1 1 130px;text-align:center;padding:14px 8px;border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .num{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:600;color:var(--ink);}
  .stat .lbl{font-size:12px;margin-top:4px;color:var(--muted);}

  .progress-wrap{background:var(--paper-alt);height:4px;overflow:hidden;margin-bottom:18px;}
  .progress-bar{background:var(--brass);height:100%;transition:width .3s;}
  .timer{display:inline-flex;font-family:'JetBrains Mono',monospace;background:var(--ink);color:var(--brass-soft);
    padding:4px 12px;border-radius:2px;font-weight:600;font-size:13px;float:right;}
  .exam-q{font-size:17px;font-weight:600;margin:10px 0 18px;font-family:'Source Serif 4',serif;line-height:1.5;}

  /* ---- Exam options: checklist rows, stamp badges on reveal ---- */
  .exam-opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:2px;
    padding:12px 46px 12px 14px;margin-bottom:9px;font-size:14.5px;cursor:pointer;position:relative;color:var(--ink);}
  .exam-opt::before{content:"";position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:14px;height:14px;border:1.5px solid var(--muted);border-radius:2px;}
  .exam-opt{padding-left:38px;}
  .exam-opt.selected{border-color:var(--ink);background:var(--paper-alt);}
  .exam-opt.selected::before{background:var(--ink);border-color:var(--ink);}
  .exam-opt.correct{border-color:var(--approve);background:var(--approve-bg);}
  .exam-opt.correct::before{background:var(--approve);border-color:var(--approve);}
  .exam-opt.wrong{border-color:var(--seal);background:var(--seal-bg);}
  .exam-opt.wrong::before{background:var(--seal);border-color:var(--seal);}
  .exam-opt.correct::after{content:"Correct";position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-4deg);
    font-family:'Source Serif 4',serif;font-size:11px;font-weight:600;color:var(--approve);
    border:1.5px solid var(--approve);border-radius:2px;padding:1px 7px;}
  .exam-opt.wrong::after{content:"Your answer";position:absolute;right:10px;top:50%;transform:translateY(-50%) rotate(-4deg);
    font-family:'Source Serif 4',serif;font-size:11px;font-weight:600;color:var(--seal);
    border:1.5px solid var(--seal);border-radius:2px;padding:1px 7px;}

  .hist-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--paper-alt);font-size:13.5px;}
  .hist-row:last-child{border-bottom:none;}
  .hist-score{font-family:'JetBrains Mono',monospace;font-weight:600;}

  .loading{display:flex;align-items:center;gap:10px;color:var(--muted);margin-top:12px;}
  .spinner{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .gen-item{border:1px solid var(--line);border-radius:2px;padding:10px 12px;margin-bottom:8px;background:#fff;}
  .gen-item label{display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:0;font-size:13.5px;}
  .note{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.55;}

  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:70vh;padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--line);border-top:3px double var(--brass);
    border-radius:2px;padding:38px 32px;max-width:380px;text-align:center;}
  .login-card h2{margin-top:0;}
  .google-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:2px;
    padding:10px 20px;font-weight:600;cursor:pointer;font-size:14.5px;margin-top:18px;color:var(--ink);}
  .google-btn:hover{border-color:var(--brass);}
  .config-warning{background:var(--seal-bg);border:1px solid var(--seal);color:var(--seal);padding:14px;border-radius:2px;margin:16px;font-size:13.5px;}
  .result-score{text-align:center;padding-bottom:6px;}
  .result-score .big{font-family:'JetBrains Mono',monospace;font-size:38px;font-weight:600;color:var(--ink);
    display:inline-block;padding-bottom:6px;border-bottom:4px double var(--ink);}
</style>
</head>
<body>
<div class="app">
  <div class="cover">
    <div>
      <h1>CA Exam Prep</h1>
      <p class="tagline">Shared question bank, your own private scores</p>
      <p class="refline" id="ledgerDate"></p>
    </div>
    <div class="userbox" id="userbox" style="display:none">
      <img id="userphoto" src="" alt="">
      <span id="username"></span>
      <button class="btn outline" style="margin:0;padding:6px 12px;font-size:12.5px" onclick="signOutUser()">Sign out</button>
    </div>
  </div>
  <div id="configWarning"></div>
  <div id="loginScreen" style="display:none">
    <div class="login-wrap">
      <div class="login-card">
        <h2>Sign in to continue</h2>
        <p class="note">Sign in with Google to access the shared question bank and your personal exam history.</p>
        <button class="google-btn" onclick="signInWithGoogle()">Sign in with Google</button>
      </div>
    </div>
  </div>
  <div id="appScreen" style="display:none">
    <nav id="navBar"></nav>
    <main id="mainView"></main>
  </div>
</div>

<script type="module">
/* =========================================================
   1) REPLACE THIS with your own Firebase project config
      (Firebase console > Project settings > General > Your apps > Web app)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDW7iPzMKtxQk5Om2k7iAjtxZIYzcgnNg4",
  authDomain: "ca-exam-prep.firebaseapp.com",
  projectId: "ca-exam-prep",
  storageBucket: "ca-exam-prep.firebasestorage.app",
  messagingSenderId: "262854448835",
  appId: "1:262854448835:web:b579f71156bbdd43687476"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, getDocs, query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let app, auth, db, currentUser = null;

document.getElementById('ledgerDate').textContent =
  'As of ' + new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });

const isConfigured = firebaseConfig.apiKey !== "YOUR_API_KEY";
if (!isConfigured) {
  document.getElementById('configWarning').innerHTML =
    `<div class="config-warning">Firebase is not configured yet. Open this file and replace the <code>firebaseConfig</code> placeholder near the top with your own project's config (see SETUP_GUIDE_BN.md).</div>`;
} else {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);

  onAuthStateChanged(auth, user => {
    currentUser = user;
    if (user) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      document.getElementById('userbox').style.display = 'flex';
      document.getElementById('userphoto').src = user.photoURL || '';
      document.getElementById('username').textContent = user.displayName || user.email;
      loadForTab(state.tab);
    } else {
      document.getElementById('loginScreen').style.display = 'block';
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('userbox').style.display = 'none';
    }
  });
}

window.signInWithGoogle = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { alert('Sign-in failed: ' + e.message); }
};
window.signOutUser = () => signOut(auth);

/* ---------------- App state & tabs ---------------- */
const TABS = [
  { id:'dashboard', label:'Home' }, { id:'bank', label:'Bank' }, { id:'pdf', label:'From PDF' },
  { id:'exam', label:'Exam' }, { id:'results', label:'Results' }
];
let state = { tab:'dashboard', questions:[], results:[], editingId:null, genPreview:[], genLoading:false, genError:'', examSession:null, examResult:null };

window.setTab = (id) => { state.tab = id; state.editingId=null; state.genError=''; state.genPreview=[]; loadForTab(id); };

function renderNav(){
  const nav = document.getElementById('navBar'); nav.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.textContent = t.label; if (t.id===state.tab) b.classList.add('active');
    b.onclick = () => setTab(t.id); nav.appendChild(b);
  });
}

async function fetchQuestions(){
  const snap = await getDocs(query(collection(db,'questions'), orderBy('createdAt','desc')));
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}
async function fetchResults(){
  // Results are shared: everyone signed in can see everyone's scores.
  const snap = await getDocs(query(collection(db,'results'), orderBy('createdAt','desc')));
  return snap.docs.map(d=>({id:d.id, ...d.data()}));
}

async function loadForTab(id){
  renderNav();
  if (!currentUser) return;
  if (id==='dashboard'){ state.questions=await fetchQuestions(); state.results=await fetchResults(); renderDashboard(); }
  else if (id==='bank'){ state.questions=await fetchQuestions(); renderBank(); }
  else if (id==='pdf'){ renderPdf(); }
  else if (id==='exam'){ if(state.examSession){renderExamRun();return;} if(state.examResult){renderExamResult();return;} state.questions=await fetchQuestions(); renderExamSetup(); }
  else if (id==='results'){ state.results=await fetchResults(); renderResults(); }
}

function topicsOf(list){ const s=new Set(); list.forEach(q=>s.add(q.topic||'General')); return Array.from(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getCorrectIndices(q){ return Array.isArray(q.correctIndices) ? q.correctIndices : [q.correctIndex]; }
function sameSet(a,b){ if(a.length!==b.length) return false; const sa=[...a].sort(), sb=[...b].sort(); return sa.every((v,i)=>v===sb[i]); }
function fmtDate(ts){
  try{
    const d = ts && typeof ts.toDate === 'function' ? ts.toDate() : null;
    if(!d) return '';
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) + ', ' +
      d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return ''; }
}

/* ---------------- Dashboard ---------------- */
function renderDashboard(){
  const total=state.questions.length;
  const myResults = state.results.filter(r=>r.uid===currentUser.uid);
  const examsN=myResults.length;
  const avg = examsN? Math.round(myResults.reduce((s,r)=>s+r.percent,0)/examsN):0;
  document.getElementById('mainView').innerHTML = `
  <div class="card"><h2>At a glance</h2>
    <div class="stat-grid">
      <div class="stat"><div class="num">${total}</div><div class="lbl">Questions in shared bank</div></div>
      <div class="stat"><div class="num">${examsN}</div><div class="lbl">Your exams taken</div></div>
      <div class="stat"><div class="num">${avg}%</div><div class="lbl">Your average score</div></div>
      <div class="stat"><div class="num">${topicsOf(state.questions).length}</div><div class="lbl">Topics</div></div>
    </div>
  </div>
  <div class="card"><h2>Get started</h2>
    <div class="btn-row">
      <button class="btn gold" onclick="setTab('bank')">Add question</button>
      <button class="btn gold" onclick="setTab('pdf')">Generate from PDF</button>
      <button class="btn" onclick="setTab('exam')" ${total===0?'disabled':''}>Start exam</button>
    </div>
  </div>`;
}

/* ---------------- Question bank ---------------- */
function renderBank(){
  const editing = state.editingId ? state.questions.find(q=>q.id===state.editingId) : null;
  const eCorrect = editing ? getCorrectIndices(editing) : [0];
  document.getElementById('mainView').innerHTML = `
  <div class="card">
    <h2>${editing? 'Edit question' : 'Add a question'}</h2>
    <label>Question</label><textarea id="qf-text" placeholder="e.g. Which of the following is a current asset?">${editing?esc(editing.question):''}</textarea>
    <label>Topic (optional)</label><input type="text" id="qf-topic" value="${editing?esc(editing.topic||''):''}" placeholder="e.g. Financial Accounting">
    <label>Options (at least 2 needed, up to 4 — tick the box next to every correct answer)</label>
    ${[0,1,2,3].map(i=>{
      const val = editing ? (editing.options[i]||'') : '';
      const checked = editing ? eCorrect.includes(i) : i===0;
      return `<div class="opt-row"><input type="checkbox" class="qf-correct" value="${i}" title="Mark as correct answer" ${checked?'checked':''}><input type="text" id="qf-opt${i}" value="${esc(val)}" placeholder="Option ${i+1}${i>=2?' (optional)':''}"></div>`;
    }).join('')}
    <p class="note">Tick every box that is a correct answer for this question — most questions have just one, but you can tick more than one if several options are correct.</p>
    <label>Explanation (optional)</label><textarea id="qf-expl">${editing?esc(editing.explanation||''):''}</textarea>
    <div class="btn-row">
      <button class="btn gold" id="qf-submit" onclick="submitQuestion()">${editing?'Save changes':'Add to shared bank'}</button>
      ${editing? `<button class="btn outline" onclick="cancelEdit()">Cancel</button>`:''}
    </div>
  </div>
  <div class="card"><h2>Shared question bank (${state.questions.length})</h2>
    ${state.questions.length? state.questions.map(q=>{
      const correctSet=getCorrectIndices(q);
      return `
      <div class="qitem">
        <div style="display:flex;justify-content:space-between;gap:10px">
          <div>
            <div class="qtext">${esc(q.question)}</div>
            <div class="qopts">${q.options.map((o,i)=>`${correctSet.includes(i)?'&#10003; ':'- '}${esc(o)}`).join(' &nbsp;|&nbsp; ')}</div>
            <div class="qmeta"><span class="tag">${esc(q.topic||'General')}</span></div>
            <div class="qtrace">Added by ${esc(q.createdByName||'someone')}${q.createdAt?', '+fmtDate(q.createdAt):''}</div>
            ${q.editCount? `<div class="qtrace">Edited ${q.editCount} time${q.editCount>1?'s':''} — last by ${esc(q.lastEditedByName||'someone')}${q.lastEditedAt?', '+fmtDate(q.lastEditedAt):''}</div>` : ''}
          </div>
          <div style="display:flex;gap:10px;flex-shrink:0;align-items:flex-start">
            <button class="btn outline" style="margin:0;padding:5px 10px;font-size:12px" onclick="editQuestion('${q.id}')">Edit</button>
            ${q.createdBy===currentUser.uid? `<button class="del-btn" onclick="removeQuestion('${q.id}')">Delete</button>`:''}
          </div>
        </div>
      </div>`;}).join('') : '<div class="empty">No questions yet.</div>'}
  </div>`;
}

window.editQuestion = (id) => { state.editingId=id; renderBank(); window.scrollTo({top:0, behavior:'smooth'}); };
window.cancelEdit = () => { state.editingId=null; renderBank(); };

window.submitQuestion = async () => {
  const text=document.getElementById('qf-text').value.trim();
  const topic=document.getElementById('qf-topic').value.trim();
  const expl=document.getElementById('qf-expl').value.trim();
  const rawOpts=[0,1,2,3].map(i=>document.getElementById('qf-opt'+i).value.trim());
  const rawCorrect=Array.from(document.querySelectorAll('.qf-correct:checked')).map(el=>parseInt(el.value,10));
  if(!text){alert('Enter a question');return;}

  const filledIndices = rawOpts.map((o,i)=>o?i:-1).filter(i=>i!==-1);
  if(filledIndices.length<2){ alert('Fill in at least 2 options'); return; }
  if(rawCorrect.length===0){ alert('Tick at least one correct answer'); return; }
  if(rawCorrect.some(i=>!rawOpts[i])){ alert('A correct-answer box is ticked next to an empty option — only tick boxes next to options you filled in'); return; }

  const options = filledIndices.map(i=>rawOpts[i]);
  const correctIndices = rawCorrect.map(i=>filledIndices.indexOf(i)).sort((a,b)=>a-b);

  document.getElementById('qf-submit').disabled=true;
  try{
    if(state.editingId){
      const existing = state.questions.find(q=>q.id===state.editingId);
      await updateDoc(doc(db,'questions',state.editingId), {
        question:text, options, correctIndices, topic:topic||'General', explanation:expl,
        lastEditedBy: currentUser.uid,
        lastEditedByName: currentUser.displayName||currentUser.email,
        lastEditedAt: serverTimestamp(),
        editCount: (existing && existing.editCount ? existing.editCount : 0) + 1
      });
      state.editingId=null;
    } else {
      await addDoc(collection(db,'questions'), {
        question:text, options, correctIndices, topic:topic||'General', explanation:expl,
        source:'manual', createdBy:currentUser.uid, createdByName:currentUser.displayName||currentUser.email,
        createdAt:serverTimestamp(), editCount:0
      });
    }
    setTab('bank');
  }catch(e){ alert('Could not save: '+e.message); document.getElementById('qf-submit').disabled=false; }
};

window.removeQuestion = async (id) => {
  if(!confirm('Delete this question from the shared bank? This cannot be undone.')) return;
  try{ await deleteDoc(doc(db,'questions',id)); setTab('bank'); }
  catch(e){ alert('Could not delete: '+e.message); }
};

/* ---------------- PDF generation ---------------- */
/* No server / Cloud Function needed. Each signed-in user pastes their own
   Anthropic API key once; it is stored only in their own browser
   (localStorage) and used only to call Anthropic directly from their device. */
function getSavedApiKey(){ return localStorage.getItem('anthropic_api_key') || ''; }
function saveApiKey(){
  const val = document.getElementById('api-key-input').value.trim();
  if(!val){ alert('Paste your API key first'); return; }
  localStorage.setItem('anthropic_api_key', val);
  renderPdf();
}
function clearApiKey(){
  if(!confirm('Remove the saved API key from this browser?')) return;
  localStorage.removeItem('anthropic_api_key');
  renderPdf();
}

function renderPdf(){
  const key = getSavedApiKey();
  document.getElementById('mainView').innerHTML = `
  <div class="card"><h2>Your Anthropic API key</h2>
    ${key ? `
      <p class="note">A key is saved in this browser (ending in ...${esc(key.slice(-4))}). It's only used from your own device to generate questions — nobody else can see it.</p>
      <button class="btn outline" onclick="clearApiKey()">Remove saved key</button>
    ` : `
      <p class="note">To generate questions from a PDF, paste your own free Anthropic API key (get one at console.anthropic.com). It's saved only in this browser, never shared with anyone else using this site.</p>
      <label>API key</label>
      <input type="text" id="api-key-input" placeholder="sk-ant-...">
      <button class="btn gold" onclick="saveApiKey()">Save key</button>
    `}
  </div>
  <div class="card"><h2>Generate from PDF</h2>
    <p class="note">Upload a PDF of notes or a textbook to auto-generate MCQs.</p>
    <label>PDF file</label><input type="file" id="pdf-file" accept="application/pdf">
    <label>How many questions</label><input type="number" id="pdf-count" value="8" min="3" max="12">
    <label>Topic name (optional)</label><input type="text" id="pdf-topic" placeholder="e.g. Taxation">
    <button class="btn gold" id="pdf-btn" onclick="generateFromPdf()" ${key?'':'disabled'}>Generate questions</button>
    ${key?'':'<p class="note">Save an API key above first.</p>'}
    <div id="pdf-status"></div>
  </div>
  <div id="pdf-preview"></div>`;
  if(state.genLoading) document.getElementById('pdf-status').innerHTML=`<div class="loading"><div class="spinner"></div>Reading the PDF and writing questions...</div>`;
  if(state.genError) document.getElementById('pdf-status').innerHTML=`<div class="loading" style="color:var(--seal)">${esc(state.genError)}</div>`;
  if(state.genPreview.length) renderGenPreview();
}
window.saveApiKey = saveApiKey;
window.clearApiKey = clearApiKey;

function renderGenPreview(){
  document.getElementById('pdf-preview').innerHTML = `
  <div class="card"><h2>Generated questions (${state.genPreview.length})</h2>
    <p class="note">Uncheck any you don't want, then add the rest to the shared bank.</p>
    ${state.genPreview.map((q,i)=>`
      <div class="gen-item"><label>
        <input type="checkbox" ${q.selected?'checked':''} onchange="toggleGenSelect(${i}, this.checked)">
        <span><strong>${esc(q.question)}</strong><br><span style="color:var(--muted)">${q.options.map((o,oi)=>`${(q.correctIndices||[]).includes(oi)?'&#10003;':'-'} ${esc(o)}`).join(' &nbsp; ')}</span></span>
      </label></div>`).join('')}
    <div class="btn-row">
      <button class="btn gold" onclick="commitPreview()">Add selected to bank</button>
      <button class="btn outline" onclick="cancelGenPreview()">Cancel</button>
    </div>
  </div>`;
}

window.toggleGenSelect = (i, checked) => { state.genPreview[i].selected = checked; };
window.cancelGenPreview = () => { state.genPreview=[]; renderPdf(); };

window.commitPreview = async () => {
  const topic = document.getElementById('pdf-topic') ? document.getElementById('pdf-topic').value.trim() : '';
  const chosen = state.genPreview.filter(q=>q.selected);
  for (const q of chosen){
    await addDoc(collection(db,'questions'), {
      question:q.question, options:q.options, correctIndices:q.correctIndices, explanation:q.explanation||'',
      topic: topic||'From PDF', source:'pdf', createdBy:currentUser.uid, createdByName:currentUser.displayName||currentUser.email,
      createdAt: serverTimestamp(), editCount: 0
    });
  }
  state.genPreview=[]; setTab('bank');
};

window.generateFromPdf = async () => {
  const apiKey = getSavedApiKey();
  if(!apiKey){ alert('Save your API key first'); return; }
  const fileInput=document.getElementById('pdf-file');
  const count=Math.min(12,Math.max(3,parseInt(document.getElementById('pdf-count').value,10)||8));
  const topic=document.getElementById('pdf-topic').value.trim();
  if(!fileInput.files.length){alert('Choose a PDF file');return;}
  const file=fileInput.files[0];
  if(file.type!=='application/pdf'){alert('Please upload a PDF file');return;}

  state.genLoading=true; state.genError=''; state.genPreview=[]; renderPdf();

  try{
    const base64Data = await new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result.split(',')[1]);
      r.onerror=()=>reject(new Error('Could not read file'));
      r.readAsDataURL(file);
    });

    const prompt = 'You are an item writer for CA (Chartered Accountancy) exam preparation. ' +
      'From the attached PDF, write exactly ' + count + ' multiple-choice questions (MCQs) in English. ' +
      'Each question has exactly 4 options. Most questions should have exactly one correct answer, ' +
      'but if a question genuinely has more than one correct option, include all of them. ' +
      'Respond with ONLY valid JSON in this exact format, no preamble, no markdown fences: ' +
      '[{"question":"...","options":["...","...","...","..."],"correctIndices":[0],"explanation":"..."}] ' +
      '"correctIndices" is always an array (e.g. [0] for a single answer, [0,2] if both are correct). ' +
      'Keep each explanation under 20 words.';

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-5',
        max_tokens:3000,
        messages:[{
          role:'user',
          content:[
            { type:'document', source:{ type:'base64', media_type:'application/pdf', data: base64Data } },
            { type:'text', text: prompt }
          ]
        }]
      })
    });
    const data = await resp.json();
    if(!resp.ok || data.error) throw new Error((data.error && data.error.message) || 'API request failed');

    const text = (data.content||[]).map(c=>c.text||'').join('\n');
    const clean = text.replace(/```json/gi,'').replace(/```/g,'').trim();
    let parsed;
    try{ parsed = JSON.parse(clean); }
    catch(e){
      const match = clean.match(/\[[\s\S]*\]/);
      if(match) parsed = JSON.parse(match[0]);
      else throw new Error('Could not read the generated questions. Try again.');
    }

    state.genPreview = parsed
      .filter(q=>q.question && Array.isArray(q.options) && q.options.length===4 && Array.isArray(q.correctIndices) && q.correctIndices.length>0)
      .map(q=>Object.assign({selected:true}, q));
    if(state.genPreview.length===0) state.genError='No valid questions were generated. Try again.';
  }catch(err){
    state.genError = err.message || 'Could not generate questions.';
  }finally{
    state.genLoading=false; renderPdf();
  }
};

/* ---------------- Exam ---------------- */
function renderExamSetup(){
  const t=topicsOf(state.questions);
  document.getElementById('mainView').innerHTML = `
  <div class="card"><h2>Set up exam</h2>
    <label>Topic</label>
    <select id="ex-topic"><option value="__all__">All topics (${state.questions.length})</option>
      ${t.map(topic=>{const c=state.questions.filter(q=>(q.topic||'General')===topic).length;
        return `<option value="${esc(topic)}">${esc(topic)} (${c})</option>`;}).join('')}
    </select>
    <label>Number of questions</label><input type="number" id="ex-count" value="10" min="1">
    <label>Time per question</label>
    <select id="ex-time"><option value="0">No limit</option><option value="30">30s</option>
      <option value="45" selected>45s</option><option value="60">60s</option><option value="90">90s</option></select>
    <button class="btn gold" onclick="startExam()" ${state.questions.length===0?'disabled':''}>Start exam</button>
  </div>`;
}

window.startExam = () => {
  const topic=document.getElementById('ex-topic').value;
  let count=parseInt(document.getElementById('ex-count').value,10)||10;
  const timeLimit=parseInt(document.getElementById('ex-time').value,10);
  let pool = topic==='__all__'? state.questions.slice() : state.questions.filter(q=>(q.topic||'General')===topic);
  pool = shuffle(pool); count=Math.min(count,pool.length); pool=pool.slice(0,count);
  if(pool.length===0){alert('No questions in this topic');return;}
  state.examSession = { questions:pool, topic: topic==='__all__'?'All topics':topic, index:0, answers:[], selected:[], revealed:false, timeLimit, timeLeft:timeLimit, timerId:null };
  renderExamRun(); startTimer();
};

function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startTimer(){
  const s=state.examSession; if(!s||!s.timeLimit||s.revealed) return;
  clearInterval(s.timerId);
  s.timerId=setInterval(()=>{
    if(!state.examSession) return;
    state.examSession.timeLeft-=1;
    if(state.examSession.timeLeft<=0){clearInterval(state.examSession.timerId); window.revealAnswer();}
    else{const el=document.getElementById('exam-timer'); if(el) el.textContent=state.examSession.timeLeft+'s';}
  },1000);
}

function renderExamRun(){
  const s=state.examSession, q=s.questions[s.index], pct=Math.round((s.index/s.questions.length)*100);
  const correctSet=getCorrectIndices(q);
  const multi = correctSet.length>1;
  document.getElementById('mainView').innerHTML = `
  <div class="card">
    ${s.timeLimit?`<span class="timer" id="exam-timer">${s.timeLeft}s</span>`:''}
    <div class="note">Question ${s.index+1} / ${s.questions.length}${multi?' — select all that apply':''}</div>
    <div class="progress-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="exam-q">${esc(q.question)}</div>
    ${q.options.map((opt,i)=>{
      let cls='exam-opt';
      if(s.revealed){ if(correctSet.includes(i)) cls+=' correct'; else if(s.selected.includes(i)) cls+=' wrong'; }
      else if(s.selected.includes(i)) cls+=' selected';
      return `<button class="${cls}" ${s.revealed?'disabled':''} onclick="toggleOption(${i})">${esc(opt)}</button>`;
    }).join('')}
    ${s.revealed && q.explanation?`<p class="note"><strong>Explanation:</strong> ${esc(q.explanation)}</p>`:''}
    <div class="btn-row">
      ${!s.revealed? `<button class="btn gold" onclick="revealAnswer()" ${s.selected.length===0?'disabled':''}>Submit answer</button>`
        : `<button class="btn gold" onclick="nextQuestion()">${s.index+1<s.questions.length?'Next question':'See results'}</button>`}
      <button class="btn outline" onclick="quitExam()">Quit</button>
    </div>
  </div>`;
}

window.toggleOption = (i) => {
  const s=state.examSession; if(!s||s.revealed) return;
  const q=s.questions[s.index];
  const multi = getCorrectIndices(q).length>1;
  if(multi){
    const pos=s.selected.indexOf(i);
    if(pos===-1) s.selected.push(i); else s.selected.splice(pos,1);
  } else {
    s.selected=[i];
  }
  renderExamRun();
};
window.revealAnswer = () => {
  const s=state.examSession; clearInterval(s.timerId);
  const q=s.questions[s.index]; s.revealed=true;
  const correctSet=getCorrectIndices(q);
  s.answers.push({selected:s.selected.slice(), correct: sameSet(s.selected, correctSet)});
  renderExamRun();
};
window.nextQuestion = () => {
  const s=state.examSession;
  if(s.index+1>=s.questions.length){ finishExam(); return; }
  s.index+=1; s.selected=[]; s.revealed=false; s.timeLeft=s.timeLimit;
  renderExamRun(); startTimer();
};
window.quitExam = () => {
  if(!confirm('Quit this exam? Progress will not be saved.')) return;
  clearInterval(state.examSession.timerId); state.examSession=null; setTab('exam');
};

async function finishExam(){
  const s=state.examSession;
  const correctCount=s.answers.filter(a=>a.correct).length, total=s.questions.length;
  const percent=Math.round((correctCount/total)*100);
  try{
    await addDoc(collection(db,'results'), {
      uid:currentUser.uid, userName:currentUser.displayName||currentUser.email,
      topic:s.topic, score:correctCount, total, percent, createdAt:serverTimestamp()
    });
  }catch(e){ console.error('Could not save result', e); }
  state.examResult={ questions:s.questions, answers:s.answers, correctCount, total, percent };
  state.examSession=null; renderExamResult();
}

window.dismissExamResult = (nextTab) => { state.examResult=null; setTab(nextTab); };

function renderExamResult(){
  const r=state.examResult;
  document.getElementById('mainView').innerHTML = `
  <div class="card result-score">
    <div class="big">${r.correctCount} / ${r.total}</div>
    <div class="note">Score: ${r.percent}%</div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn gold" onclick="dismissExamResult('exam')">Take another exam</button>
      <button class="btn outline" onclick="dismissExamResult('results')">View results</button>
    </div>
  </div>
  <div class="card"><h2>Review</h2>
    ${r.questions.map((q,i)=>{
      const a=r.answers[i];
      const correctSet=getCorrectIndices(q);
      return `<div class="qitem"><div class="qtext">${i+1}. ${esc(q.question)}</div>
        <div class="qopts">${q.options.map((o,oi)=>{
          let mark=''; if(correctSet.includes(oi)) mark=' &#10003;'; else if(a.selected.includes(oi)) mark=' &#10007;';
          return `${esc(o)}${mark}`;
        }).join(' &nbsp;|&nbsp; ')}</div>
        ${q.explanation?`<div class="note">${esc(q.explanation)}</div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------------- Results ---------------- */
function renderResults(){
  document.getElementById('mainView').innerHTML = `
  <div class="card"><h2>Everyone's results</h2>
    ${state.results.length? state.results.map(r=>`
      <div class="hist-row">
        <span>
          <strong>${esc(r.userName||'someone')}</strong> — ${esc(r.topic)} — ${r.score}/${r.total}${r.createdAt?', '+fmtDate(r.createdAt):''}
        </span>
        <span style="display:flex;align-items:center;gap:14px">
          <strong class="hist-score" style="color:${r.percent>=60?'var(--approve)':'var(--seal)'}">${r.percent}%</strong>
          ${r.uid===currentUser.uid? `<button class="del-btn" onclick="removeResult('${r.id}')">Delete</button>`:''}
        </span>
      </div>`).join('')
      : '<div class="empty">No exams taken yet.</div>'}
  </div>`;
}

window.removeResult = async (id) => {
  if(!confirm('Delete this exam result? This cannot be undone.')) return;
  try{ await deleteDoc(doc(db,'results',id)); setTab('results'); }
  catch(e){ alert('Could not delete: '+e.message); }
};
</script>
</body>
</html>
